[package]
name = "revops"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
cln-plugin = "0.7"
cln-rpc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
revops-analytics = { path = "../revops-analytics" }
revops-boltz = { path = "../revops-boltz" }
revops-capital = { path = "../revops-capital" }
revops-core = { path = "../revops-core" }
revops-db = { path = "../revops-db" }
revops-econ = { path = "../revops-econ" }
revops-fees = { path = "../revops-fees" }
revops-lnplus = { path = "../revops-lnplus" }
revops-rebalance = { path = "../revops-rebalance" }
revops-rpc = { path = "../revops-rpc" }
rusqlite.workspace = true
# "process" (beyond the workspace default fs+std): Task 10's cutover-arm
# identity needs the running process's real uid (`rustix::process::getuid`)
# to build `cutover_arm::RunningIdentity` at plugin startup.
rustix = { workspace = true, features = ["process"] }
sha2.workspace = true

[dev-dependencies]
hex.workspace = true
tempfile.workspace = true
